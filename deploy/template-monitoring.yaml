---
parameters:
- name: NAMESPACE
  value: ''
  required: true
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: assisted-image-service-monitoring
objects:
- apiVersion: monitoring.rhobs/v1
  kind: ServiceMonitor
  metadata:
    labels:
      prometheus: app-sre
    name: servicemonitor-image-service-coo
  spec:
    endpoints:
    - interval: 30s
      path: /metrics
      port: image-service
      scheme: http
    namespaceSelector:
      matchNames:
      - ${NAMESPACE}
    selector:
      matchLabels:
        name: assisted-image-service
